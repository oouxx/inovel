services:
  novel-reader:
    # 镜像由 GitHub Actions 构建推送(仓库 .github/workflows/docker.yml)
    # 首次发布后如拉取 403,需在 GitHub 包设置里把可见性改为 Public
    image: ghcr.io/oouxx/inovel:latest
    container_name: novel-reader
    restart: unless-stopped
    # 宿主机 8080 被其他服务占用,对外暴露 8090,容器内仍是 8080
    ports:
      - "${PORT:-8090}:8080"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /app/data
      NOVELS_DIR: /app/data/novels
      # 如需 AI 走代理,可在服务器 .env 里自行设置 HTTP_PROXY 等变量(env_file 自动注入)
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3